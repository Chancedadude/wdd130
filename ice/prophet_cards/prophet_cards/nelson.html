<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russell M. Nelson</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Insert styles here, this is called an internal stylesheet  */
        body {
            background: #FFECD7;
            font-family: Helvetica, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: #008DB1;
            border: 4px solid #004e63;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            max-width: 350px;
        }

        .card h1 {
            color: #fffffe
            font-family: Helvetica, sans-serif;
            margin-bottom: 10px;
        }

        .card h2 a {
            color: #91E4FB;
            text-decoration: none;
            font-family: Helvetica, sans-serif;
            font-size: 16px;
        }

        .card img {
            width: 100%;
            height: auto;
            border: 4px solid white;
            margin: 20px 0;
        }

        .card ul {
            list-style-type: disc;
            color: #fffffe;
            padding-left: 20px;
            text-align: left;
            font-family: Helvetica, sans-serif;
        }

        .card quote {
            color: #FFD783;
            font-family: "Brush Script MT", "Nanum Brush Script", cursive;
            margin-top: 20px;
            font-size: 18px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Russell M. Nelson</h1>
    <h2>
        <a href="https://churchofjesuschrist.org" target="_blank">
        17th President of the Church of Jesus Christ of Latter-day Saints
    </h2>
    <img src="images/russell_nelson.png" alt="Logo image">
    <ul>
        <li>Born: Sep 9, 1924</li>
        <li>Apostle: Apr 7, 1984</li>
        <li>Prophet: Jan 14, 2018</li>
    </ul>
    <p class="quote">
        "I urge you to devote time each week -<br />
        for the rest of your life - to increase<br />
        your understanding of the atonement of<br />
        Jesus Christ."
    </p>
    </div>
</body>
</html>
