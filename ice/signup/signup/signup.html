<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
            font-family: georgia, serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #formContainer {
            background: white;
            border-radius: 20px;
            border: 8px solid #1a3a75;
            overflow: hidden;
            width: 450px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            max-height: 90vh;
            display: flex; 
            flex-direction: column;
            overflow-y: auto;
        }

        .header {
            position: relative;
            text-align: center;
            padding-top: 5px;
        }

        .header img {
            width: 100%;
            height: auto;
        }

        #closeBtn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: white;
            border: none;
            font-size: 18px;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            z-index: 2;
        }

        .header-text {
            position: absolute;
            bottom: 15px;
            width: 100%;
            color: white;
            text-shadow: 0 0 5px black;
        }

        .header-text h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        .header-text p {
            font-size: 1rem;
            margin: 0;
        }

        form {
            padding: 1rem;
        }

        form label {
            display: block;
            margin-top: 10px;
        }

        form input[type="text"], form input[type="password"], form input[type="email"] {
            width: 100%;
            padding: 5px;
            margin-top: 4px;
            box-sizing: border-box;
        }

        form section {
            margin-top: 10px;
        }

        form button[type="submit"] {
            margin-top: 10px;
            width: 100%;
            padding: 6px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }
        
        .footer-nav {
            display: flex;
            justify-content: space-between;
            background: black;
            padding: 10px;
            border-top: 1px solid #ccc;
        }

        .footer-nav img {
            height: 50px;
            width: auto;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
        }

        h3 {
            text-align: center;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .header + h3 {
            margin-bottom: 10px;
        }

        form section:last-of-type {
            margin-bottom: 10px;
        }

        .form-row {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }

        .form-row > label {
            width: 80px;
            margin-right: 10px;
            white-space: nowrap;
        }

        .inline-options {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            text-align: center;
        }
    </style>




</head>

<body>
    <div id="formContainer">
        <div class="header">
            <img src="images/jesus_feeds_5000.jpeg" alt="jesus_feeds_5000">
            <div class="header-text">
                <h1>Daily Feed</h1>
                <p>Scripture a Day</p>    
            </div>
        </div>
        
        <h3>Sign Up for Daily Scripture Feed</h3>
        <button type="button" id="closeBtn">X</button>

        <form id="myForm">
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <div class="form-row">
                <label for="gender">Gender:</label>
            <div class="inline-options">
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>
        </div>

            <section>
                <div class="checkbox-row">
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
                </div>
            </section>

            <section>
                <div class="checkbox-row">
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
                </div>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>
        </form>

        <div class="footer-nav">
            <img src="images/old_testament.webp" alt="Old Testament">
            <img src="images/new_testament.webp" alt="New Testament">
            <img src="images/book_of_mormon.webp" alt="Book of Mormon">
            <img src="images/doctrine_and_covenants.webp" alt="Doctrine and Covenants">
            <img src="images/pearl_of_great_price.webp" alt="Pearl of Great Price">
        </div>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
