<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <h2>Favorite Devotionals</h2>
        <table class="table">
        <thead>
          <tr>
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
            </tr>
            </thead>
            <tbody>
              <tr>
                <td>Jeffery R. holland</td>
                <td>Remember Lot's wife</td>
                <td>BYU</td>
                <td>2009</td>
              </tr>
              <tr>
                <td>Dallin H. Oaks</td>
                <td>A life of Law, Leadership, and Legacy </td>
                <td>BYU</td>
                <td>2025</td>
              </tr>
              <tr>
                <td>Michelle D. Craig</td>
                <td>Divine Discontent</td>
                <td>BYU</td>
                <td>2018</td>
              </tr>
            </tbody>
          </table>
      <h3>Add a Devotional</h3>
      <form class="form">
        <label for="speaker">Speaker:</label>
        <input type="text" id="speaker" name="speaker"><br>

        <label for="title">Title:</label>
        <input type="text" id="title" name="title"><br>

        <label for="location">Location:</label>
        <input type="text" id="location" name="location"><br>

        <label for="year">Year:</label>
        <input type="text" id="year" name="year"><br>

        <button type="submit">Submit</button>
      </form>
      </div>
    </main>
  </div>
</body>
</html>
